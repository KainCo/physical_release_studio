<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical Release Studio — Hub</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 1000px; width: 100%; }
    header { text-align: center; margin-bottom: 40px; position: relative; }
    
    /* Logo Integration */
    .header-logo { max-width: 280px; height: auto; margin-bottom: 12px; display: inline-block; }

    .kofi-header { position: absolute; top: 0; right: 0; }
    @media (max-width: 600px) { .kofi-header { position: static; margin-bottom: 15px; } }
    .kofi-btn { display: inline-flex; align-items: center; gap: 6px; background: #ff5e5b; color: white; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; text-decoration: none; box-shadow: 0 2px 5px rgba(255,94,91,0.3); transition: transform 0.2s; }
    .kofi-btn:hover { transform: translateY(-2px); }
    h1 { font-size: 2rem; color: var(--primary); margin-bottom: 8px; }
    p.subtitle { color: #64748b; font-size: 1rem; }
    
    .section-title { font-size: 1.2rem; font-weight: bold; margin: 30px 0 15px; padding-bottom: 8px; border-bottom: 2px solid var(--border); color: #1e293b; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); border-color: var(--primary); }
    .card h3 { font-size: 1rem; margin-bottom: 6px; color: #0f172a; }
    .card p { font-size: 0.85rem; color: #64748b; line-height: 1.4; margin-bottom: 12px; }
    .badge { font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; width: fit-content; transition: background 0.2s, color 0.2s; }
    .badge-ready { background: #dcfce7; color: #166534; }
    .badge-planned { background: #fee2e2; color: #991b1b; }

    footer { margin-top: 50px; font-size: 0.85rem; color: #94a3b
