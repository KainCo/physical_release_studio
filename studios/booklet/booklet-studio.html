<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical Release Studio — Booklet Studio</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- PDF.js für den PDF/GOG Booklet-Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }
  </script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --border: #1f293d;
      --hover: #1a2336;
      --brand: #2563eb;
      --brand-accent: #a855f7;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 1024px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(9, 13, 22, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand-title i { font-size: 1.5rem; color: #3b82f6; }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .lang-switcher {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      display: flex;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      border-radius: 6px;
    }

    .lang-btn.active { background: var(--brand); color: white; }

    .btn-index {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-index:hover { border-color: var(--brand); }

    .ui-container {
      width: 100%;
      max-width: 1024px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }

    .header-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }

    .sub-title {
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .option-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .option-card label { font-weight: bold; font-size: 0.85rem; color: var(--text); }

    .option-card select, .option-card input[type="file"] {
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      max-width: 100%;
    }

    .num-input {
      width: 70px;
      padding: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    .layout-info {
      flex-basis: 100%;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }
    .layout-info .warn { color: #fbbf24; }
    .layout-info .bad { color: #f87171; }

    .upload-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      max-height: 380px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
    }

    .upload-card {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .upload-card.active { border-color: var(--brand); }

    .upload-card label {
      display: block;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .upload-card input[type="file"] { width: 100%; font-size: 0.75rem; color: var(--text-muted); }

    .dpi-container { display: none; margin-top: 10px; text-align: left; }

    .dpi-badge {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .dpi-badge.green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .dpi-badge.yellow { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .dpi-badge.red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .dpi-scale-wrapper {
      position: relative;
      width: 100%;
      background: #1f293d;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }

    .scale-segment { height: 100%; }
    .scale-red { width: 37.5%; background: #ef4444; }
    .scale-yellow { width: 37.5%; background: #f59e0b; }
    .scale-green { width: 25%; background: #10b981; }

    .scale-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #fff;
      transform: translateX(-50%);
      transition: left 0.3s ease;
    }

    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }

    .tab-btn {
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: var(--bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .control-group label.group-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 8px;
    }

    .btn-row { display: flex; gap: 4px; flex-wrap: wrap; }

    .btn-small {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }

    .btn-small:hover { border-color: var(--brand); }
    .btn-small.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .nudge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 110px; margin: 0 auto; }
    .nudge-grid button { padding: 6px; font-size: 0.75rem; background: var(--card-bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; cursor: pointer; }
    .nudge-grid button:hover { border-color: var(--brand); }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 6px;
    }

    details.advanced {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.8rem;
    }
    details.advanced summary { cursor: pointer; color: var(--text-muted); font-weight: bold; }
    details.advanced .adv-body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    details.advanced .adv-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    details.advanced .hint { color: var(--text-muted); font-size: 0.72rem; }

    .btn-print {
      width: 100%;
      background: #10b981;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-print:hover { background: #059669; }

    .preview-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      width: 100%;
      max-width: 1024px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 32px 16px;
      border-radius: 16px;
    }

    .sheet-preview {
      background: var(--bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
    }

    .sheet-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: var(--text); text-align: center; }

    .spread-container {
      display: flex;
      background: var(--card-bg);
      position: relative;
      outline: 2px dashed var(--brand);
    }

    .fold-line-preview {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1px dotted var(--text-muted);
      z-index: 10;
      pointer-events: none;
    }

    /* Frames keep a fixed content size; the active state is drawn with an outline,
       so the preview never changes size when the selection changes (WYSIWYG). */
    .frame-container {
      box-sizing: content-box;
      position: relative;
      background: var(--bg);
      overflow: hidden;
      touch-action: none;
      outline: 1px solid var(--border);
      outline-offset: -1px;
    }

    .frame-container.active-target {
      outline: 3px solid var(--brand);
      outline-offset: -3px;
      z-index: 5;
    }

    .frame-container.blank {
      background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 8px, var(--card-bg) 8px, var(--card-bg) 16px);
    }

    .cover-img {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: none;
      max-height: none;
      transform-origin: center center;
      pointer-events: none;
      user-select: none;
    }

    .placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      pointer-events: none;
    }

    .page-badge-preview {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 8;
      pointer-events: none;
    }

    /* ---- Print screen: A4 landscape sheets, one per page.
       Page height is 1 mm below the sheet so the browser never adds a blank page. ---- */
    #printScreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #e5e7eb;
      z-index: 9999;
      padding: 10px;
      overflow: auto;
    }

    #print-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .print-sheet {
      position: relative;
      flex: none;
      width: 297mm;
      height: 209mm;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    .sheet-inner { position: absolute; inset: 0; }

    .print-page-img { position: absolute; display: block; max-width: none; max-height: none; }

    .mark { position: absolute; background: #000; }
    .mark.fold { background: #555; }

    .sheet-label { font-size: 0.75rem; color: #374151; font-weight: bold; margin-bottom: 4px; text-align: center; }

    @media screen {
      #print-container { zoom: 0.8; }
    }

    @media print {
      @page { size: A4 landscape; margin: 0 !important; }

      html, body.print-open {
        width: 297mm !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body.print-open header,
      body.print-open .ui-container,
      body.print-open .preview-wrapper,
      body.print-open canvas,
      body.print-open footer,
      body.print-open .no-print { display: none !important; }

      body.print-open #printScreen {
        display: block !important;
        position: static !important;
        width: 297mm !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: #fff !important;
      }

      body.print-open #print-container {
        display: block !important;
        zoom: 1 !important;
      }

      .print-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        break-after: page;
        page-break-after: always;
      }

      .print-sheet.is-last { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="btn-index">
      <i class="fa-solid fa-arrow-left"></i>
      <span data-i18n="nav_index">Zurück zur Übersicht</span>
    </a>

    <a href="#" class="brand-title">
      <i class="fa-solid fa-book-open"></i>
      <div>
        <div style="font-weight: 800; font-size: 1rem;">PHYSICAL RELEASE</div>
        <div style="font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;">Booklet Studio <p>&copy; 2026 KainCo. Alle Rechte vorbehalten.</p></div>
      </div>
    </a>

    <div class="header-actions">
      <div class="lang-switcher">
        <button id="lang-en" onclick="setLanguage('en')" class="lang-btn">EN</button>
        <button id="lang-de" onclick="setLanguage('de')" class="lang-btn active">DE</button>
      </div>
      <a href="https://paypal.me/kainco" target="_blank" rel="noopener noreferrer"
         style="background: #0070ba; color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
        <i class="fa-brands fa-paypal"></i> <span data-i18n="btn_donation">Spende</span>
      </a>
      <a href="https://ko-fi.com/kainco" target="_blank" rel="noopener noreferrer"
         style="background: #ff5e5b; color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
        <i class="fa-solid fa-mug-hot"></i> Support
      </a>
    </div>
  </header>

  <div class="ui-container">
    <div class="header-title" data-i18n="studio_title">Booklet Studio</div>
    <div class="sub-title" data-i18n="studio_subtitle">Booklet-Erstellungsstudio | A4 quer, Sattelheftung für Heimdrucker</div>

    <!-- Format Selection -->
    <div class="option-card" style="border-color: var(--brand);">
      <label for="formatSelect"><span data-i18n="lbl_format">📐 Booklet Format / Größe:</span></label>
      <select id="formatSelect" onchange="changeFormat(this.value)">
        <option value="cd" data-i18n="opt_format_cd">CD (12,0 × 12,0 cm)</option>
        <option value="ps34" data-i18n="opt_format_ps34">PlayStation 3 / 4</option>
        <option value="bluray" data-i18n="opt_format_bluray">Blu-ray</option>
        <option value="dvd" data-i18n="opt_format_dvd">DVD</option>
        <option value="custom" data-i18n="opt_format_custom">Eigenes Format</option>
      </select>
      <div id="customFields" style="display: none; align-items: center; gap: 8px; flex-wrap: wrap;">
        <label><span data-i18n="lbl_custom_w">Breite</span> <input type="number" id="customW" class="num-input" step="0.1" min="3" max="14.5" value="12" oninput="onCustomChange()"> cm</label>
        <span>×</span>
        <label><span data-i18n="lbl_custom_h">Höhe</span> <input type="number" id="customH" class="num-input" step="0.1" min="3" max="19" value="12" oninput="onCustomChange()"> cm</label>
      </div>
      <div class="layout-info" id="layoutInfo"></div>
    </div>

    <!-- PDF / GOG Booklet Import Card -->
    <div class="option-card">
      <label for="pdfImportInput"><i class="fa-solid fa-file-pdf" style="color: #ef4444;"></i> <span data-i18n="lbl_pdf_import">GOG / PDF Booklet Import (Autom. Doppelseiten-Split):</span></label>
      <input type="file" id="pdfImportInput" accept="application/pdf" onchange="importPDFBooklet(event)">
      <div class="layout-info" id="importStatus"></div>
    </div>

    <!-- Page Selection -->
    <div class="option-card">
      <label for="pageCountSelect"><span data-i18n="lbl_page_count">📖 Seitenzahl:</span></label>
      <select id="pageCountSelect" onchange="changeTotalPages(this.value)"></select>
    </div>

    <!-- Print Mode Selection -->
    <div class="option-card">
      <label for="printModeSelect"><span data-i18n="lbl_print_mode">🖨️ Druckmodus:</span></label>
      <select id="printModeSelect">
        <option value="duplex_saddle" data-i18n="opt_mode_saddle">Sattelheftung, automatisch beidseitig (empfohlen)</option>
        <option value="manual_fronts" data-i18n="opt_mode_fronts">Manuell – erst alle Außenseiten</option>
        <option value="manual_backs" data-i18n="opt_mode_backs">Manuell – dann alle Innenseiten</option>
        <option value="sequential_duplex" data-i18n="opt_mode_seq">Doppelseiten der Reihe nach (ohne Ausschießung)</option>
      </select>
    </div>

    <!-- Dynamic Upload Cards -->
    <div class="upload-cards" id="upload-cards-container"></div>

    <!-- Tabs Container -->
    <div class="tabs" id="tabs-container"></div>

    <div class="controls-grid">
      <!-- Rotation & Flip -->
      <div class="control-group">
        <label class="group-title" data-i18n="lbl_rotation">Drehung & Spiegeln</label>
        <div class="btn-row">
          <button class="btn-small" onclick="rotate(0)">0°</button>
          <button class="btn-small" onclick="rotate(-90)">-90°</button>
          <button class="btn-small" onclick="rotate(90)">+90°</button>
          <button class="btn-small" onclick="rotate(180)">180°</button>
          <button class="btn-small" id="btn-flip" onclick="toggleFlip()" data-i18n="btn_flip">↔️ Spiegeln</button>
        </div>
      </div>

      <!-- Granular Zoom (100 % = Seite gefüllt) -->
      <div class="control-group">
        <label class="group-title" for="zoomInput" data-i18n="lbl_zoom">Zoom (%)</label>
        <div style="display: flex; gap: 6px; align-items: center; width: 100%; margin-bottom: 6px;">
          <input type="range" id="zoomSlider" min="30" max="400" step="0.1" value="100" style="flex: 1;" oninput="updateZoom(this.value)">
          <input type="number" id="zoomInput" min="30" max="400" step="0.1" value="100" class="num-input" style="width: 64px;" oninput="updateZoom(this.value)">
        </div>
        <div class="btn-row">
          <button class="btn-small" style="flex: 1;" onclick="stepZoom(-1)">-1%</button>
          <button class="btn-small" style="flex: 1;" onclick="stepZoom(-0.1)">-0.1%</button>
          <button class="btn-small" style="flex: 1;" onclick="stepZoom(0.1)">+0.1%</button>
          <button class="btn-small" style="flex: 1;" onclick="stepZoom(1)">+1%</button>
        </div>
      </div>

      <!-- Position Nudge Pad -->
      <div class="control-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="group-title" style="margin: 0;" data-i18n="lbl_nudge">Position verschieben</label>
          <div class="btn-row" style="gap: 2px;">
            <button id="step-1" class="btn-small on" style="padding: 2px 6px;" onclick="setNudgeStep(1)">1px</button>
            <button id="step-5" class="btn-small" style="padding: 2px 6px;" onclick="setNudgeStep(5)">5px</button>
            <button id="step-10" class="btn-small" style="padding: 2px 6px;" onclick="setNudgeStep(10)">10px</button>
          </div>
        </div>
        <div class="nudge-grid">
          <div></div>
          <button onclick="nudge(0, -1)"><i class="fa-solid fa-arrow-up"></i></button>
          <div></div>
          <button onclick="nudge(-1, 0)"><i class="fa-solid fa-arrow-left"></i></button>
          <button style="color: var(--brand); font-weight: bold;" onclick="resetPos()">•</button>
          <button onclick="nudge(1, 0)"><i class="fa-solid fa-arrow-right"></i></button>
          <div></div>
          <button onclick="nudge(0, 1)"><i class="fa-solid fa-arrow-down"></i></button>
          <div></div>
        </div>
      </div>

      <!-- Alignment & Options -->
      <div class="control-group">
        <label class="group-title" data-i18n="lbl_alignment">Ausrichtung & Druck</label>
        <div class="btn-row" style="margin-bottom: 8px;">
          <button class="btn-small" style="flex: 1;" onclick="fitCover()" data-i18n="btn_fit_fill">Füllen</button>
          <button class="btn-small" style="flex: 1;" onclick="fitContain()" data-i18n="btn_fit_contain">Ganz einpassen</button>
          <button class="btn-small" style="flex: 1;" onclick="resetTransforms()" data-i18n="btn_reset">Zurücksetzen</button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="showGuidelines" checked>
          <span data-i18n="opt_crop_marks">Schnitt- & Falzmarken drucken</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="bleedOn" onchange="onAdvChange()">
          <span data-i18n="opt_bleed">Innenseiten mit leichtem Überstand (gleicht Duplex-Versatz aus)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="mirrorBacks" onchange="onAdvChange()">
          <span data-i18n="opt_mirror">Innenseiten spiegeln (falls Schrift nach dem Druck spiegelverkehrt ist)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="shiftOn" onchange="onAdvChange()">
          <span data-i18n="opt_shift">Innenseiten manuell verschieben (X / Y)</span>
        </label>
        <div id="shiftFields" style="display: none; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.75rem; padding-left: 22px;">
          <label>X <input type="number" id="shiftX" class="num-input" step="0.5" min="-10" max="10" value="0" oninput="onAdvChange()"> mm</label>
          <label>Y <input type="number" id="shiftY" class="num-input" step="0.5" min="-10" max="10" value="0" oninput="onAdvChange()"> mm</label>
          <span class="hint" data-i18n="hint_shift" style="flex-basis: 100%;">+X = nach rechts, +Y = nach unten (so wie du die Innenseite ansiehst). Wird in diesem Browser gespeichert.</span>
        </div>
      </div>
    </div>


    <button class="btn-print" onclick="preparePrint()" data-i18n="btn_print_booklet">🖨️ Booklet drucken / Als PDF speichern</button>
  </div>

  <!-- Dynamic Preview Wrapper -->
  <div class="preview-wrapper" id="preview-wrapper"></div>

  <!-- Print Screen -->
  <div id="printScreen">
    <div style="padding: 10px; text-align: center; background: #f3f4f6; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;" class="no-print">
      <button onclick="window.print()" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;" data-i18n="btn_print_now">Jetzt drucken / PDF speichern</button>
      <button onclick="closePrint()" style="padding: 10px 20px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer;" data-i18n="btn_close">Schließen</button>
      <div data-i18n="print_hint" style="flex-basis: 100%; font-size: 0.75rem; color: #4b5563;"></div>
    </div>
    <div id="print-container"></div>
  </div>

  <script>
    // ------------------------------------------------------------------
    //  Constants & format table (all sizes in cm). Add new formats here.
    // ------------------------------------------------------------------
    const MM = 25.4, DPI = 300;
    const SHEET_W = 297, SHEET_H = 210;     // A4 landscape (nominal)
    const MARK_LEN = 5;                     // crop mark length in mm
    const MAX_PAGES = 24;

    const FORMATS = {
      cd:     { w: 12.0, h: 12.0 },
      ps34:   { w: 11.8, h: 14.6 },         // PlayStation 3 / 4 booklet (W x H)
      bluray: { w: 12.9, h: 14.9 },
      dvd:    { w: 12.0, h: 18.0 },
      custom: { w: 12.0, h: 12.0 }          // user defined (e.g. GameCube)
    };

    let currentFormat = 'cd';
    let totalPages = 4;
    let activeTarget = 'p1';
    let currentLang = localStorage.getItem('prs_lang') || 'de';

    const state = {};                       // per page: x, y (fraction of frame width), userZoom (1 = fills page), ...
    const geom = { fw: 240, fh: 240, ppc: 20 };
    const adv = { bleedOn: false, bleedMm: 3.5, mirror: false, shiftOn: false, dx: 0, dy: 0 };

    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    };

    // ------------------------------------------------------------------
    //  i18n
    // ------------------------------------------------------------------
    const i18n = {
      en: {

        studio_subtitle: "Booklet Creation Studio | A4 landscape, saddle stitch for home printers",

        opt_format_dvd: "DVD (12.0 × 18.0 cm)",
        opt_format_custom: "Custom size (e.g. GameCube) …",
        lbl_custom_w: "Width", lbl_custom_h: "Height",
        lbl_pdf_import: "GOG / PDF Booklet Import (Auto-Split Spreads):",

        opt_mode_saddle: "Saddle stitch, automatic duplex (recommended)",
        opt_mode_fronts: "Manual – all outsides first",
        opt_mode_backs: "Manual – then all insides",
        opt_mode_seq: "Spreads in sequence (no imposition)",
        lbl_rotation: "Rotation & Flip", btn_flip: "↔️ Flip",
        lbl_zoom: "Zoom (%)", lbl_nudge: "Nudge position",
        lbl_alignment: "Alignment & Print",
        btn_fit_fill: "Fill", btn_fit_contain: "Fit all", btn_reset: "Reset",
        opt_crop_marks: "Print crop & fold marks",
        opt_bleed: "Inside pages with slight overscan (hides the printer's duplex offset)",
        adv_title: "Advanced",
        lbl_bleed_mm: "Overscan (mm):",
        hint_bleed: "Inside pages only: the image is printed slightly larger towards the outer edges and reaches past the cut line. Keep important content (text) at least 5 mm from the edge.",
        opt_mirror: "Mirror inside pages (if text is mirrored after printing)",
        opt_shift: "Shift inside pages manually (X / Y)",
        hint_shift: "+X = right, +Y = down (as you look at the inside page). Saved in this browser.",
        btn_print_booklet: "🖨️ Print Booklet / Save as PDF",
        btn_print_now: "Print Now / Save PDF", btn_close: "Close",
        print_hint: "A4 landscape, scale 100 %, margins “None”, double-sided → flip on short edge. Then fold, staple on the fold (at ¼ and ¾ of the height) and trim the three open edges at the crop marks.",
        ph_select: "Select image for P. ", blank_page: "Blank page",
        sheet_word: "Sheet", sheet_front: "Outside", sheet_back: "Inside", lbl_left: "Left", lbl_right: "Right",
        page_word: "Page", page_cover: "Cover", page_back: "Back", page_front_label: "Cover / Front", page_back_label: "Back Cover",
        alert_no_image: "Please select at least one image for the booklet!",

        alert_no_pdfjs: "The PDF library could not be loaded (internet connection?).",

        info_nomarks: "ℹ Not enough room for crop marks – they will be cut off",
        info_importing: "Importing page {i} / {n} …",
        dpi_excellent: "Excellent", dpi_good: "Good", dpi_low: "Low quality"
      },
      de: {
        nav_index: "Zurück zur Übersicht", btn_donation: "Spende",
        studio_title: "Booklet Studio",
        studio_subtitle: "Booklet-Erstellungsstudio | A4 quer, Sattelheftung für Heimdrucker",
        lbl_format: "📐 Booklet Format / Größe:",
        opt_format_cd: "CD (12,0 × 12,0 cm)",
        opt_format_ps34: "PlayStation 3 / 4 (11,8 × 14,6 cm, B × H)",
        opt_format_bluray: "Blu-ray (12,9 × 14,9 cm)",
        opt_format_dvd: "DVD (12,0 × 18,0 cm)",
        opt_format_custom: "Eigenes Format (z. B. GameCube) …",
        lbl_custom_w: "Breite", lbl_custom_h: "Höhe",
        lbl_pdf_import: "GOG / PDF Booklet Import (Autom. Doppelseiten-Split):",
        lbl_page_count: "📖 Seitenzahl:",
        pages_opt: "{n} Seiten · {s} Blatt",
        pages_opt_blank: "{n} Seiten · {s} Blatt (+{b} Leerseiten)",
        lbl_print_mode: "🖨️ Druckmodus:",
        opt_mode_saddle: "Sattelheftung, automatisch beidseitig (empfohlen)",
        opt_mode_fronts: "Manuell – erst alle Außenseiten",
        opt_mode_backs: "Manuell – dann alle Innenseiten",
        opt_mode_seq: "Doppelseiten der Reihe nach (ohne Ausschießung)",
        lbl_rotation: "Drehung & Spiegeln", btn_flip: "↔️ Spiegeln",
        lbl_zoom: "Zoom (%)", lbl_nudge: "Position verschieben",
        lbl_alignment: "Ausrichtung & Druck",
        btn_fit_fill: "Füllen", btn_fit_contain: "Ganz einpassen", btn_reset: "Zurücksetzen",
        opt_crop_marks: "Schnitt- & Falzmarken drucken",
        opt_bleed: "Innenseiten mit leichtem Überstand (gleicht Duplex-Versatz aus)",
        adv_title: "Erweitert",
        lbl_bleed_mm: "Überstand (mm):",
        hint_bleed: "Nur Innenseiten: Das Bild wird nach außen etwas größer gedruckt und ragt über die Schnittkante hinaus. Wichtiges (Schrift) mindestens 5 mm vom Rand weghalten.",
        opt_mirror: "Innenseiten spiegeln (falls Schrift nach dem Druck spiegelverkehrt ist)",
        opt_shift: "Innenseiten manuell verschieben (X / Y)",
        hint_shift: "+X = nach rechts, +Y = nach unten (so wie du die Innenseite ansiehst). Wird in diesem Browser gespeichert.",
        btn_print_booklet: "🖨️ Booklet drucken / Als PDF speichern",
        btn_print_now: "Jetzt drucken / PDF speichern", btn_close: "Schließen",
        print_hint: "A4 quer, Skalierung 100 %, Ränder „Keine“, beidseitig → kurze Kante. Danach falten, auf dem Falz (bei ¼ und ¾ der Höhe) heften und die drei offenen Seiten an den Schnittmarken beschneiden.",
        ph_select: "Wähle Bild für S. ", blank_page: "Leerseite",
        sheet_word: "Blatt", sheet_front: "Außenseite", sheet_back: "Innenseite", lbl_left: "Links", lbl_right: "Rechts",
        page_word: "Seite", page_cover: "Cover", page_back: "Rück", page_front_label: "Cover / Vorne", page_back_label: "Rückseite",
        alert_no_image: "Bitte wähle mindestens ein Bild für das Booklet aus!",
        alert_import_success: "PDF erfolgreich importiert und Doppelseiten aufgeteilt!",
        alert_no_pdfjs: "Die PDF-Bibliothek konnte nicht geladen werden (Internetverbindung?).",
        alert_too_many: "Das PDF hat mehr als 24 Seiten – es wurden nur die ersten 24 importiert.",
        alert_nofit: "Dieses Format passt nicht auf ein A4-Blatt (quer).",
        info_layout: "{pages} Seiten → {sheets} Blatt A4 · nutzt {util} % der Blattfläche",
        info_nofit: "⚠ Passt nicht auf A4 quer (Doppelseite {w} × {h} mm inkl. Überstand)",
        info_nomarks: "ℹ Kein Platz für Schnittmarken – sie werden teilweise abgeschnitten",
        info_importing: "Importiere Seite {i} / {n} …",
        dpi_excellent: "Hervorragend", dpi_good: "Gut", dpi_low: "Niedrige Qualität"
      }
    };

    const t = (key, vars) => {
      let s = (i18n[currentLang] && i18n[currentLang][key]) || i18n.en[key] || key;
      if (vars) Object.keys(vars).forEach(k => { s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]); });
      return s;
    };

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('prs_lang', lang);
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      document.getElementById('lang-de').classList.toggle('active', lang === 'de');
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      buildPageOptions();
      initBooklet();
    }

    // ------------------------------------------------------------------
    //  Format / geometry helpers
    // ------------------------------------------------------------------
    const fmt = () => FORMATS[currentFormat];
    const bleedMm = () => (adv.bleedOn ? adv.bleedMm : 0);
    const capacity = (n) => Math.ceil(n / 4) * 4;

    function computeGeom() {
      const f = fmt();
      const avail = Math.max(220, Math.min(window.innerWidth, 1024) - 110);
      let ppc = Math.floor(Math.min(20, avail / (2 * f.w)));
      ppc = Math.max(ppc, 6);
      geom.ppc = ppc;
      geom.fw = Math.round(f.w * ppc);
      geom.fh = geom.fw * f.h / f.w;         // exact aspect ratio (may be fractional)
    }

    // Layout figures for the info line and the print check (all mm)
    function layoutMetrics() {
      const f = fmt(), b = bleedMm();
      const w = f.w * 10, h = f.h * 10;
      const gap = b + 1;
      return {
        w, h, b,
        spreadW: 2 * w + 2 * b, spreadH: h + 2 * b,
        fits: (2 * w + 2 * b) <= SHEET_W && (h + 2 * b) <= (SHEET_H - 1),
        marksFit: (2 * w + 2 * (gap + MARK_LEN)) <= SHEET_W && (h + 2 * (gap + MARK_LEN)) <= (SHEET_H - 1),
        util: Math.round((2 * w * h) / (SHEET_W * SHEET_H) * 100)
      };
    }

    function updateLayoutInfo() {
      const m = layoutMetrics();
      const el = document.getElementById('layoutInfo');
      const sheets = capacity(totalPages) / 4;
      let html = t('info_layout', { pages: totalPages, sheets, util: m.util });
      if (!m.fits) html += `<br><span class="bad">${t('info_nofit', { w: Math.round(m.spreadW), h: Math.round(m.spreadH) })}</span>`;
      else if (!m.marksFit) html += `<br><span class="warn">${t('info_nomarks')}</span>`;
      el.innerHTML = html;
    }

    // ------------------------------------------------------------------
    //  Imposition (saddle stitch) with back cover always on the last slot
    // ------------------------------------------------------------------
    function slotToPage(slot, n) {
      const c = capacity(n);
      if (slot === c) return n;               // back cover is always the last slot
      if (slot >= n) return null;             // blank page
      return slot;
    }

    function saddleItems(n) {
      const c = capacity(n), out = [];
      for (let s = 0; s < c / 4; s++) {
        out.push({ sheet: s + 1, isBack: false, left: slotToPage(c - 2 * s, n), right: slotToPage(1 + 2 * s, n) });
        out.push({ sheet: s + 1, isBack: true,  left: slotToPage(2 + 2 * s, n), right: slotToPage(c - 1 - 2 * s, n) });
      }
      return out;
    }

    function sequentialItems(n) {
      const out = [];
      for (let i = 1, k = 0; i <= n; i += 2, k++) {
        out.push({ sheet: Math.floor(k / 2) + 1, isBack: k % 2 === 1, left: i, right: i + 1 <= n ? i + 1 : null });
      }
      return out;
    }

    const isLoaded = (p) => p && state['p' + p] && state['p' + p].loaded;

    // ------------------------------------------------------------------
    //  State & UI building
    // ------------------------------------------------------------------
    function ensure(key) {
      if (!state[key]) state[key] = { x: 0, y: 0, userZoom: 1, rotation: 0, flipX: 1, loaded: false, src: null, img: null, nw: 0, nh: 0 };
      return state[key];
    }

    function pageLabel(i) {
      if (i === 1) return `${t('page_word')} 1 (${t('page_front_label')})`;
      if (i === totalPages) return `${t('page_word')} ${i} (${t('page_back_label')})`;
      return `${t('page_word')} ${i}`;
    }

    function buildPageOptions() {
      const sel = document.getElementById('pageCountSelect');
      sel.innerHTML = '';
      for (let n = 2; n <= MAX_PAGES; n += 2) {
        const c = capacity(n);
        const o = document.createElement('option');
        o.value = n;
        o.textContent = n === c
          ? t('pages_opt', { n, s: c / 4 })
          : t('pages_opt_blank', { n, s: c / 4, b: c - n });
        if (n === totalPages) o.selected = true;
        sel.appendChild(o);
      }
    }

    function changeFormat(id) {
      if (!FORMATS[id]) id = 'cd';
      currentFormat = id;
      document.getElementById('formatSelect').value = id;
      document.getElementById('customFields').style.display = id === 'custom' ? 'flex' : 'none';
      store.set('prs_booklet_format', id);
      computeGeom();
      initBooklet();
    }

    function onCustomChange() {
      const w = Math.min(14.5, Math.max(3, parseFloat(document.getElementById('customW').value) || 12));
      const h = Math.min(19, Math.max(3, parseFloat(document.getElementById('customH').value) || 12));
      FORMATS.custom = { w, h };
      store.set('prs_booklet_custom', FORMATS.custom);
      if (currentFormat === 'custom') { computeGeom(); initBooklet(); }
    }

    function changeTotalPages(val) {
      totalPages = parseInt(val, 10);
      initBooklet();
    }

    function initBooklet() {
      const container = document.getElementById('upload-cards-container');
      const tabsContainer = document.getElementById('tabs-container');
      const previewWrapper = document.getElementById('preview-wrapper');
      container.innerHTML = '';
      tabsContainer.innerHTML = '';
      previewWrapper.innerHTML = '';

      if (!state[activeTarget] || parseInt(activeTarget.slice(1), 10) > totalPages) activeTarget = 'p1';

      for (let i = 1; i <= totalPages; i++) {
        const key = 'p' + i;
        ensure(key);

        const card = document.createElement('div');
        card.className = 'upload-card' + (key === activeTarget ? ' active' : '');
        card.id = `card-${key}`;
        card.onclick = () => selectTab(key);
        card.innerHTML = `
          <label for="file-${key}">📷 ${pageLabel(i)}</label>
          <input type="file" id="file-${key}" accept="image/*" onchange="loadFile(event, '${key}')">
          <div id="dpi-container-${key}" class="dpi-container">
            <div id="dpi-badge-${key}" class="dpi-badge"></div>
            <div class="dpi-scale-wrapper">
              <div class="scale-segment scale-red"></div>
              <div class="scale-segment scale-yellow"></div>
              <div class="scale-segment scale-green"></div>
              <div id="dpi-marker-${key}" class="scale-marker" style="left: 0%;"></div>
            </div>
          </div>`;
        container.appendChild(card);

        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (key === activeTarget ? ' active' : '');
        btn.id = `tab-${key}`;
        btn.onclick = () => selectTab(key);
        btn.textContent = `S. ${i}`;
        tabsContainer.appendChild(btn);
      }

      saddleItems(totalPages).forEach((item) => {
        const sheetDiv = document.createElement('div');
        sheetDiv.className = 'sheet-preview';

        const title = document.createElement('div');
        title.className = 'sheet-title';
        const side = item.isBack ? t('sheet_back') : t('sheet_front');
        title.textContent = `${t('sheet_word')} ${item.sheet} – ${side} [${t('lbl_left')}: S. ${item.left || '–'} | ${t('lbl_right')}: S. ${item.right || '–'}]`;
        sheetDiv.appendChild(title);

        const spreadBox = document.createElement('div');
        spreadBox.className = 'spread-container';
        spreadBox.innerHTML = '<div class="fold-line-preview"></div>';
        spreadBox.appendChild(createFrame(item.left));
        spreadBox.appendChild(createFrame(item.right));
        sheetDiv.appendChild(spreadBox);
        previewWrapper.appendChild(sheetDiv);
      });

      for (let i = 1; i <= totalPages; i++) refreshFrame('p' + i);
      selectTab(activeTarget);
      updateLayoutInfo();
    }

    function createFrame(pageNum) {
      const frame = document.createElement('div');
      frame.style.width = geom.fw + 'px';
      frame.style.height = geom.fh + 'px';

      if (!pageNum) {
        frame.className = 'frame-container blank';
        frame.innerHTML = `<div class="placeholder">${t('blank_page')}</div>`;
        return frame;
      }

      const key = 'p' + pageNum;
      frame.className = 'frame-container' + (key === activeTarget ? ' active-target' : '');
      frame.id = `frame-${key}`;
      frame.dataset.key = key;

      let badge = `${t('page_word')} ${pageNum}`;
      if (pageNum === 1) badge = `${t('page_word')} 1 (${t('page_cover')})`;
      else if (pageNum === totalPages) badge = `${t('page_word')} ${pageNum} (${t('page_back')})`;

      frame.innerHTML = `
        <div class="page-badge-preview">${badge}</div>
        <div class="placeholder">${t('ph_select')}${pageNum}</div>
        <img class="cover-img" style="display:none;" alt="S. ${pageNum}" draggable="false">`;
      return frame;
    }

    function selectTab(key) {
      activeTarget = key;
      for (let i = 1; i <= totalPages; i++) {
        const k = 'p' + i;
        const tab = document.getElementById(`tab-${k}`);
        const card = document.getElementById(`card-${k}`);
        const frame = document.getElementById(`frame-${k}`);
        if (tab) tab.classList.toggle('active', k === key);
        if (card) card.classList.toggle('active', k === key);
        if (frame) frame.classList.toggle('active-target', k === key);
      }
      updateControls();
    }

    // ------------------------------------------------------------------
    //  Transforms (stored resolution independent: x/y as fraction of frame width,
    //  userZoom relative to "page filled")
    // ------------------------------------------------------------------
    function dims(s) {
      const swap = Math.abs(s.rotation % 180) === 90;
      return { w: swap ? s.nh : s.nw, h: swap ? s.nw : s.nh };
    }

    function coverScale(s) { const d = dims(s); return Math.max(geom.fw / d.w, geom.fh / d.h); }
    function effScale(s) { return coverScale(s) * s.userZoom; }

    function applyTransform(key) {
      const fr = document.getElementById(`frame-${key}`);
      const s = state[key];
      if (!fr || !s || !s.loaded) return;
      const img = fr.querySelector('img');
      const sc = effScale(s);
      img.style.width = s.nw + 'px';
      img.style.height = s.nh + 'px';
      img.style.transform =
        `translate(calc(-50% + ${s.x * geom.fw}px), calc(-50% + ${s.y * geom.fw}px)) rotate(${s.rotation}deg) scale(${sc * s.flipX}, ${sc})`;
    }

    function refreshFrame(key) {
      const fr = document.getElementById(`frame-${key}`);
      const s = state[key];
      if (fr && s) {
        const img = fr.querySelector('img');
        const ph = fr.querySelector('.placeholder');
        if (s.loaded) {
          img.src = s.src;
          img.style.display = 'block';
          if (ph) ph.style.display = 'none';
          applyTransform(key);
        } else {
          img.style.display = 'none';
          if (ph) ph.style.display = '';
        }
      }
      updateDPI(key);
    }

    function updateControls() {
      const s = state[activeTarget];
      if (!s) return;
      const val = parseFloat((s.userZoom * 100).toFixed(1));
      document.getElementById('zoomSlider').value = val;
      document.getElementById('zoomInput').value = val;
    }

    // Effective DPI = native pixels per inch of the page as it will be printed (includes zoom)
    function updateDPI(key) {
      const s = state[key];
      const container = document.getElementById(`dpi-container-${key}`);
      const badge = document.getElementById(`dpi-badge-${key}`);
      const marker = document.getElementById(`dpi-marker-${key}`);
      if (!s || !s.loaded || !container) return;
      container.style.display = 'block';

      const dpi = Math.round(geom.fw / (effScale(s) * (fmt().w / 2.54)));
      let pos;
      if (dpi <= 150) pos = (dpi / 150) * 37.5;
      else if (dpi < 300) pos = 37.5 + ((dpi - 150) / 150) * 37.5;
      else pos = 75 + (Math.min(dpi - 300, 100) / 100) * 25;
      marker.style.left = `${Math.min(Math.max(pos, 2), 98)}%`;

      badge.className = 'dpi-badge';
      if (dpi >= 300) { badge.classList.add('green'); badge.innerHTML = `🟢 <b>${dpi} DPI</b> – ${t('dpi_excellent')}`; }
      else if (dpi >= 150) { badge.classList.add('yellow'); badge.innerHTML = `🟡 <b>${dpi} DPI</b> – ${t('dpi_good')}`; }
      else { badge.classList.add('red'); badge.innerHTML = `🔴 <b>${dpi} DPI</b> – ${t('dpi_low')}`; }
    }

    function updateZoom(val) {
      const s = state[activeTarget];
      if (!s) return;
      const v = Math.min(400, Math.max(30, parseFloat(val) || 100));
      s.userZoom = v / 100;
      applyTransform(activeTarget);
      updateDPI(activeTarget);
      updateControls();
    }

    function stepZoom(delta) {
      const s = state[activeTarget];
      if (s) updateZoom(s.userZoom * 100 + delta);
    }

    // Nudge in preview pixels (s.x / s.y are stored as a fraction of the page width)
    let nudgeStep = 1;
    function setNudgeStep(n) {
      nudgeStep = n;
      [1, 5, 10].forEach(v => document.getElementById('step-' + v).classList.toggle('on', v === n));
    }
    function nudge(dx, dy) {
      const s = state[activeTarget];
      if (!s || !s.loaded) return;
      s.x += dx * nudgeStep / geom.fw;
      s.y += dy * nudgeStep / geom.fw;
      applyTransform(activeTarget);
    }
    function resetPos() {
      const s = state[activeTarget];
      if (!s || !s.loaded) return;
      s.x = 0; s.y = 0;
      applyTransform(activeTarget);
    }

    function rotate(deg) {
      const s = state[activeTarget];
      s.rotation = deg;
      applyTransform(activeTarget);
      updateDPI(activeTarget);
    }

    function toggleFlip() {
      const s = state[activeTarget];
      s.flipX = s.flipX === 1 ? -1 : 1;
      applyTransform(activeTarget);
    }

    function fitCover() {
      const s = state[activeTarget];
      s.x = 0; s.y = 0; s.userZoom = 1;
      applyTransform(activeTarget); updateDPI(activeTarget); updateControls();
    }

    function fitContain() {
      const s = state[activeTarget];
      if (!s.loaded) return;
      s.x = 0; s.y = 0; s.userZoom = containScale(s) / coverScale(s);
      applyTransform(activeTarget); updateDPI(activeTarget); updateControls();
    }

    function resetTransforms() {
      const s = state[activeTarget];
      s.x = 0; s.y = 0; s.userZoom = 1; s.rotation = 0; s.flipX = 1;
      if (s.loaded) { applyTransform(activeTarget); updateDPI(activeTarget); }
      updateControls();
    }

    // ------------------------------------------------------------------
    //  Dragging (pointer events, registered once, delegated)
    // ------------------------------------------------------------------
    let drag = null;
    function initDrag() {
      const wrap = document.getElementById('preview-wrapper');
      wrap.addEventListener('pointerdown', (e) => {
        const fr = e.target.closest('.frame-container');
        if (!fr || !fr.dataset.key) return;
        const key = fr.dataset.key;
        selectTab(key);
        const s = state[key];
        if (!s.loaded) return;
        drag = { key, sx: e.clientX, sy: e.clientY, ox: s.x, oy: s.y };
        try { fr.setPointerCapture(e.pointerId); } catch (err) {}
      });
      wrap.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const s = state[drag.key];
        s.x = drag.ox + (e.clientX - drag.sx) / geom.fw;
        s.y = drag.oy + (e.clientY - drag.sy) / geom.fw;
        applyTransform(drag.key);
      });
      const end = () => { drag = null; };
      wrap.addEventListener('pointerup', end);
      wrap.addEventListener('pointercancel', end);
    }

    // ------------------------------------------------------------------
    //  Image loading
    // ------------------------------------------------------------------
    function setPageImage(key, url) {
      return new Promise((resolve) => {
        const s = ensure(key);
        const im = new Image();
        im.onload = () => {
          if (s.src && s.src.startsWith('blob:') && s.src !== url) URL.revokeObjectURL(s.src);
          s.img = im; s.src = url; s.nw = im.naturalWidth; s.nh = im.naturalHeight; s.loaded = true;
          s.x = 0; s.y = 0; s.userZoom = 1; s.rotation = 0; s.flipX = 1;
          resolve();
        };
        im.onerror = () => resolve();
        im.src = url;
      });
    }

    async function loadFile(e, key) {
      const file = e.target.files[0];
      if (!file) return;
      selectTab(key);
      await setPageImage(key, URL.createObjectURL(file));
      refreshFrame(key);
      updateControls();
    }

    // ------------------------------------------------------------------
    //  PDF / GOG import – renders at print resolution, splits landscape spreads
    // ------------------------------------------------------------------
    const canvasToBlobUrl = (canvas) => new Promise((res) =>
      canvas.toBlob((b) => res(URL.createObjectURL(b)), 'image/jpeg', 0.92));

    async function importPDFBooklet(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!window.pdfjsLib) { alert(t('alert_no_pdfjs')); return; }
      const status = document.getElementById('importStatus');

      try {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
        const f = fmt();
        const targetW = Math.round(f.w * 10 / MM * DPI), targetH = Math.round(f.h * 10 / MM * DPI);   // FORMATS are in cm
        const urls = [];

        for (let i = 1; i <= pdf.numPages && urls.length < MAX_PAGES; i++) {
          status.textContent = t('info_importing', { i, n: pdf.numPages });
          const page = await pdf.getPage(i);
          const v1 = page.getViewport({ scale: 1 });
          const spread = v1.width > v1.height * 1.3;
          const pw = spread ? v1.width / 2 : v1.width;
          const scale = Math.min(4, Math.max(1, Math.max(targetW / pw, targetH / v1.height)));
          const vp = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(vp.width);
          canvas.height = Math.round(vp.height);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: ctx, viewport: vp }).promise;

          if (spread) {
            const half = Math.floor(canvas.width / 2);
            for (const x0 of [0, half]) {
              if (urls.length >= MAX_PAGES) break;
              const c = document.createElement('canvas');
              c.width = half; c.height = canvas.height;
              c.getContext('2d').drawImage(canvas, x0, 0, half, canvas.height, 0, 0, half, canvas.height);
              urls.push(await canvasToBlobUrl(c));
            }
          } else {
            urls.push(await canvasToBlobUrl(canvas));
          }
        }

        let target = Math.max(2, Math.ceil(urls.length / 2) * 2);
        target = Math.min(target, MAX_PAGES);
        totalPages = target;
        buildPageOptions();
        initBooklet();

        for (let idx = 0; idx < urls.length && idx < totalPages; idx++) {
          const key = 'p' + (idx + 1);
          await setPageImage(key, urls[idx]);
          refreshFrame(key);
        }
        status.textContent = '';
        if (pdf.numPages > 0 && urls.length >= MAX_PAGES) alert(t('alert_too_many'));
        else alert(t('alert_import_success'));
      } catch (err) {
        status.textContent = String(err && err.message ? err.message : err);
      }
    }

    // ------------------------------------------------------------------
    //  Rendering at 300 DPI; optional overscan on the inside pages (outer sides only)
    // ------------------------------------------------------------------
    function renderPage(key, side, over) {
      const s = state[key];
      if (!s || !s.loaded) return null;
      const f = fmt();
      const Wp = Math.round(f.w * 10 / MM * DPI), Hp = Math.round(f.h * 10 / MM * DPI);   // FORMATS are in cm
      const bp = over ? Math.round(adv.bleedMm / MM * DPI) : 0;
      const sf = Wp / geom.fw;                                  // preview px -> print px
      const out = document.createElement('canvas');
      out.width = Wp + bp; out.height = Hp + 2 * bp;
      const c = out.getContext('2d');
      c.fillStyle = '#fff';
      c.fillRect(0, 0, out.width, out.height);
      c.imageSmoothingQuality = 'high';
      const ox = side === 'L' ? bp : 0;                         // page origin inside the canvas
      c.save();
      if (over) {
        // enlarge around the fold edge (stays in place) / vertical centre -> grows only outwards, never over the neighbour page
        const os = (f.w * 10 + adv.bleedMm) / (f.w * 10);
        const ax = side === 'L' ? Wp : 0, ay = Hp / 2;
        c.translate(ox + ax, bp + ay);
        c.scale(os, os);
        c.translate(-ax, -ay);
      } else {
        c.translate(ox, bp);
      }
      c.translate(Wp / 2 + s.x * Wp, Hp / 2 + s.y * Wp);
      c.rotate(s.rotation * Math.PI / 180);
      c.scale(effScale(s) * sf * s.flipX, effScale(s) * sf);
      c.drawImage(s.img, -s.nw / 2, -s.nh / 2);
      c.restore();
      return out.toDataURL('image/jpeg', 0.95);
    }

    // ------------------------------------------------------------------
    //  Print
    // ------------------------------------------------------------------
    function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

    function printItems(mode) {
      const n = totalPages;
      const has = (it) => isLoaded(it.left) || isLoaded(it.right);
      if (mode === 'sequential_duplex') return sequentialItems(n).filter(has);
      const all = saddleItems(n);
      // skip whole sheets that have no image at all (saves paper)
      const used = new Set();
      all.forEach(it => { if (has(it)) used.add(it.sheet); });
      let items = all.filter(it => used.has(it.sheet));
      if (mode === 'manual_fronts') items = items.filter(it => !it.isBack && has(it));
      if (mode === 'manual_backs') items = items.filter(it => it.isBack && has(it));
      return items;
    }

    function buildSheet(item, isLast) {
      const m = layoutMetrics();
      const { w, h, b } = m;
      const x0 = (SHEET_W - 2 * w) / 2, xm = x0 + w, x1 = x0 + 2 * w;
      const y0 = (SHEET_H - h) / 2, y1 = y0 + h;

      const sheet = el('div', 'print-sheet' + (isLast ? ' is-last' : ''));
      const inner = el('div', 'sheet-inner');
      if (item.isBack && (adv.shiftOn || adv.mirror)) {
        // mirror the whole back sheet around its centre, then shift (shift is measured as you look at the printed sheet)
        inner.style.transform = `${adv.shiftOn ? `translate(${adv.dx}mm, ${adv.dy}mm) ` : ''}${adv.mirror ? 'scaleX(-1)' : ''}`;
      }

      const bb = item.isBack ? b : 0;                           // overscan only on the inside pages
      const addImg = (url, left, width) => {
        if (!url) return;
        const im = el('img', 'print-page-img');
        im.style.cssText = `left:${left}mm;top:${y0 - bb}mm;width:${width}mm;height:${h + 2 * bb}mm;`;
        im.src = url;
        inner.appendChild(im);
      };
      addImg(item.left && isLoaded(item.left) ? renderPage('p' + item.left, 'L', bb > 0) : null, x0 - bb, w + bb);
      addImg(item.right && isLoaded(item.right) ? renderPage('p' + item.right, 'R', bb > 0) : null, xm, w + bb);

      if (document.getElementById('showGuidelines').checked) {
        const gap = b + 1, T = 0.2;
        const line = (l, tp, ww, hh, cls) => {
          const d = el('div', 'mark' + (cls ? ' ' + cls : ''));
          d.style.cssText = `left:${l}mm;top:${tp}mm;width:${ww}mm;height:${hh}mm;`;
          inner.appendChild(d);
        };
        [x0, x1].forEach(x => { line(x - T / 2, y0 - gap - MARK_LEN, T, MARK_LEN); line(x - T / 2, y1 + gap, T, MARK_LEN); });
        line(xm - T / 2, y0 - gap - MARK_LEN, T, MARK_LEN, 'fold');
        line(xm - T / 2, y1 + gap, T, MARK_LEN, 'fold');
        [y0, y1].forEach(y => { line(x0 - gap - MARK_LEN, y - T / 2, MARK_LEN, T); line(x1 + gap, y - T / 2, MARK_LEN, T); });
      }

      sheet.appendChild(inner);
      return sheet;
    }

    function preparePrint() {
      let loadedCount = 0;
      for (let i = 1; i <= totalPages; i++) if (isLoaded(i)) loadedCount++;
      if (!loadedCount) { alert(t('alert_no_image')); return; }
      if (!layoutMetrics().fits) { alert(t('alert_nofit')); return; }

      const mode = document.getElementById('printModeSelect').value;
      const items = printItems(mode);
      const container = document.getElementById('print-container');
      container.innerHTML = '';

      items.forEach((item, idx) => {
        const wrap = el('div');
        const label = el('div', 'sheet-label no-print');
        label.textContent = `${t('sheet_word')} ${item.sheet} – ${item.isBack ? t('sheet_back') : t('sheet_front')}`;
        wrap.appendChild(label);
        wrap.appendChild(buildSheet(item, idx === items.length - 1));
        container.appendChild(wrap);
      });

      document.body.classList.add('print-open');
      document.getElementById('printScreen').style.display = 'block';
    }

    function closePrint() {
      document.getElementById('printScreen').style.display = 'none';
      document.body.classList.remove('print-open');
    }

    // ------------------------------------------------------------------
    //  Advanced options (bleed, duplex shift) – persisted
    // ------------------------------------------------------------------
    function onAdvChange() {
      adv.bleedOn = document.getElementById('bleedOn').checked;
      adv.mirror = document.getElementById('mirrorBacks').checked;
      adv.shiftOn = document.getElementById('shiftOn').checked;
      adv.dx = parseFloat(document.getElementById('shiftX').value) || 0;
      adv.dy = parseFloat(document.getElementById('shiftY').value) || 0;
      document.getElementById('shiftFields').style.display = adv.shiftOn ? 'flex' : 'none';
      store.set('prs_booklet_adv3', adv);
      updateLayoutInfo();
    }

    function restoreAdv() {
      Object.assign(adv, store.get('prs_booklet_adv3', {}));
      adv.bleedMm = 3.5;                                        // fixed overscan
      document.getElementById('bleedOn').checked = !!adv.bleedOn;
      document.getElementById('mirrorBacks').checked = !!adv.mirror;
      document.getElementById('shiftOn').checked = !!adv.shiftOn;
      document.getElementById('shiftX').value = adv.dx;
      document.getElementById('shiftY').value = adv.dy;
      document.getElementById('shiftFields').style.display = adv.shiftOn ? 'flex' : 'none';
    }

    // ------------------------------------------------------------------
    //  Init
    // ------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      Object.assign(FORMATS.custom, store.get('prs_booklet_custom', {}));
      document.getElementById('customW').value = FORMATS.custom.w;
      document.getElementById('customH').value = FORMATS.custom.h;
      restoreAdv();
      initDrag();

      const q = (new URLSearchParams(window.location.search).get('format') || '').toLowerCase();
      const wanted = FORMATS[q] ? q : store.get('prs_booklet_format', 'cd');
      currentFormat = FORMATS[wanted] ? wanted : 'cd';
      document.getElementById('formatSelect').value = currentFormat;
      document.getElementById('customFields').style.display = currentFormat === 'custom' ? 'flex' : 'none';
      computeGeom();
      setLanguage(currentLang);

      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          const old = geom.fw;
          computeGeom();
          if (geom.fw !== old) initBooklet();
        }, 250);
      });
    });
  </script>
</body>
</html>
